name: .NET MAUI CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install .NET MAUI workload
      run: dotnet workload install maui --source https://api.nuget.org/v3/index.json

    - name: Restore dependencies
      run: dotnet restore CrocoManager/CrocoManager.sln

    - name: Run Tests
      run: dotnet test CrocoManager.Core.Tests/CrocoManager.Core.Tests.csproj --no-restore --configuration Release --verbosity normal

  build-android:
    needs: test
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Install .NET MAUI workload
      run: dotnet workload install maui --source https://api.nuget.org/v3/index.json
    
    - name: Create appsettings.json
      shell: pwsh
      run: |
        $settings = @{
          Supabase = @{
            Url = "${{ secrets.SUPABASE_URL }}"
            AnonKey = "${{ secrets.SUPABASE_ANON_KEY }}"
          }
        } | ConvertTo-Json -Depth 3
        $settings | Out-File -FilePath "CrocoManager/appsettings.json" -Encoding UTF8
    
    - name: Restore dependencies
      run: dotnet restore CrocoManager/CrocoManager.sln
    
    - name: Build Android APK
      run: |
        dotnet publish CrocoManager/CrocoManager.csproj `
          -f net9.0-android `
          -c Release `
          -p:AndroidPackageFormat=apk `
          -p:AndroidKeyStore=false `
          -o ./artifacts/android
    
    - name: Prepare Android Artifact
      shell: pwsh
      run: |
        $apk = Get-ChildItem -Path ./artifacts/android -Filter "*-Signed.apk" -Recurse | Select-Object -First 1
        if ($apk) {
            Copy-Item $apk.FullName -Destination "./artifacts/android/CrocoManager.apk"
        } else {
            Write-Error "No Signed APK found!"
            exit 1
        }

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: CrocoManager-Android
        path: ./artifacts/android/CrocoManager.apk
        retention-days: 7

  build-windows:
    needs: test
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Install .NET MAUI workload
      run: dotnet workload install maui --source https://api.nuget.org/v3/index.json
    
    - name: Create appsettings.json
      shell: pwsh
      run: |
        $settings = @{
          Supabase = @{
            Url = "${{ secrets.SUPABASE_URL }}"
            AnonKey = "${{ secrets.SUPABASE_ANON_KEY }}"
          }
        } | ConvertTo-Json -Depth 3
        $settings | Out-File -FilePath "CrocoManager/appsettings.json" -Encoding UTF8
    
    - name: Restore dependencies
      run: dotnet restore CrocoManager/CrocoManager.sln
    
    - name: Build Windows
      run: |
        dotnet publish CrocoManager/CrocoManager.csproj `
          -f net9.0-windows10.0.19041.0 `
          -c Release `
          -p:RuntimeIdentifierOverride=win10-x64 `
          -p:WindowsPackageType=None `
          -p:WindowsAppSDKSelfContained=true `
          -p:SelfContained=true `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:DebugType=none `
          -o ./artifacts/windows

    - name: Upload Windows Build
      uses: actions/upload-artifact@v4
      with:
        name: CrocoManager-Windows
        path: ./artifacts/windows/
        retention-days: 7
