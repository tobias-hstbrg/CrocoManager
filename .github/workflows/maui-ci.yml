name: .NET MAUI CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Install .NET MAUI workload
      run: dotnet workload install maui
    
    - name: Create appsettings.json
      run: |
        $settings = @{
          Supabase = @{
            Url = "${{ secrets.SUPABASE_URL }}"
            AnonKey = "${{ secrets.SUPABASE_ANON_KEY }}"
          }
        } | ConvertTo-Json -Depth 3
        $settings | Out-File -FilePath "appsettings.json" -Encoding UTF8
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Android
      run: dotnet build -f net9.0-android -c Release
    
    - name: Upload Android artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: '**/*.apk'

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Install .NET MAUI workload
      run: dotnet workload install maui
    
    - name: Create appsettings.json
      run: |
        $settings = @{
          Supabase = @{
            Url = "${{ secrets.SUPABASE_URL }}"
            AnonKey = "${{ secrets.SUPABASE_ANON_KEY }}"
          }
        } | ConvertTo-Json -Depth 3
        $settings | Out-File -FilePath "appsettings.json" -Encoding UTF8
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Windows
      run: dotnet publish -f net9.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: '**/bin/Release/**/*.exe'